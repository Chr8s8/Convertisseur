<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1741B0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B3C8F" media="(prefers-color-scheme: dark)">
<title>Convertisseur d’unités</title>
<style>
:root {
  --bg: #EAEFF2;
  --surface: #FFFFFF;
  --ink: #101E26;
  --muted: #52656F;
  --line: #CBD5DB;
  --accent: #1B4FD6;
  --on-accent: #FFFFFF;
  --tint: #E3EBFF;
  --tint2: #CFDCFF;
  --warn: #8A5200;
  --bad: #B3261E;
  --band: #1741B0;
  --band-ink: #FFFFFF;
  --band-muted: #D5DDF1;
  --chip-line: rgba(255, 255, 255, 0.42);
  --chip-on: #FFFFFF;
  --chip-on-ink: #1741B0;
  --ruler: #1741B0;
  --font: Bahnschrift, "DIN Alternate", "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1317;
    --surface: #151F26;
    --ink: #E6EDF0;
    --muted: #97A8B1;
    --line: #27363F;
    --accent: #8FB0FF;
    --on-accent: #0C1317;
    --tint: #1C2D4B;
    --tint2: #2A4272;
    --warn: #E5A646;
    --bad: #FF8A80;
    --band: #1B3C8F;
    --band-ink: #FFFFFF;
    --band-muted: #CBD6F2;
    --chip-line: rgba(255, 255, 255, 0.4);
    --chip-on: #FFFFFF;
    --chip-on-ink: #1B3C8F;
    --ruler: #4A6FD0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1317;
  --surface: #151F26;
  --ink: #E6EDF0;
  --muted: #97A8B1;
  --line: #27363F;
  --accent: #8FB0FF;
  --on-accent: #0C1317;
  --tint: #1C2D4B;
  --tint2: #2A4272;
  --warn: #E5A646;
  --bad: #FF8A80;
  --band: #1B3C8F;
  --band-ink: #FFFFFF;
  --band-muted: #CBD6F2;
  --chip-line: rgba(255, 255, 255, 0.4);
  --chip-on: #FFFFFF;
  --chip-on-ink: #1B3C8F;
  --ruler: #4A6FD0;
  color-scheme: dark;
}
html { -webkit-text-size-adjust: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 1rem/1.5 var(--font);
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; touch-action: manipulation; }
button { cursor: pointer; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Bandeau : titre, langue, grandeurs */
.band { background: var(--band); color: var(--band-ink); padding-top: env(safe-area-inset-top, 0px); }
.band-in { max-width: 720px; margin: 0 auto; padding: 18px 16px 0; }
.band :focus-visible { outline-color: var(--band-ink); }
.band-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
h1 { margin: 0; font-size: clamp(1.4rem, 5.6vw, 2.2rem); line-height: 1.1; font-weight: 700; letter-spacing: -0.01em; }
.lede { margin: 6px 0 0; color: var(--band-muted); font-size: 0.92rem; line-height: 1.4; max-width: 46ch; }

.lang {
  position: relative;
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 40px;
  padding: 0 10px 0 12px;
  border: 1px solid var(--chip-line);
  border-radius: 999px;
  font-size: 0.92rem;
}
.lang:focus-within { outline: 2px solid var(--band-ink); outline-offset: 2px; }
.lang select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; cursor: pointer; }
.lang select { color-scheme: light; color: #000; }
.lang select option { color: #000; background: #fff; }

.tabs {
  --fl: 0px;
  --fr: 28px;
  display: flex;
  gap: 8px;
  margin: 0 -16px;
  padding: 2px 16px 16px;
  overflow-x: auto;
  scroll-snap-type: x proximity;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 var(--fl), #000 calc(100% - var(--fr)), transparent 100%);
  mask-image: linear-gradient(90deg, transparent 0, #000 var(--fl), #000 calc(100% - var(--fr)), transparent 100%);
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none;
  scroll-snap-align: center;
  min-height: 42px;
  padding: 0 16px;
  border: 1px solid var(--chip-line);
  border-radius: 999px;
  background: transparent;
  color: var(--band-ink);
  font-size: 0.98rem;
  white-space: nowrap;
}
.tab[aria-selected="true"] { background: var(--chip-on); border-color: var(--chip-on); color: var(--chip-on-ink); font-weight: 700; }

/* Règle graduée : les graduations pendent du bord du bandeau */
.ruler {
  height: 16px;
  background:
    repeating-linear-gradient(90deg, var(--ruler) 0 1px, transparent 1px 40px) left top / 100% 16px no-repeat,
    repeating-linear-gradient(90deg, var(--ruler) 0 1px, transparent 1px 8px) left top / 100% 7px no-repeat;
}

/* Contenu */
.app { max-width: 720px; margin: 0 auto; padding: 14px 16px 48px; }
.qdesc { margin: 0 2px 14px; color: var(--muted); font-size: 0.92rem; max-width: 62ch; }

/* Choix des unités : deux grandes cartes et un bouton d’inversion au centre */
.pickers { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pick {
  position: relative;
  display: grid;
  gap: 1px;
  align-content: center;
  min-width: 0;
  min-height: 92px;
  padding: 10px 40px 10px 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
}
.swap + .pick { padding-left: 28px; }
.pick:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.pick-cap { color: var(--muted); font-size: 0.78rem; }
.pick-sym { display: block; font-size: 1.5rem; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick-name { display: block; color: var(--muted); font-size: 0.82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick-chev { position: absolute; right: 16px; bottom: 16px; color: var(--muted); }
.pick select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; cursor: pointer; }
.swap {
  position: absolute;
  left: 50%; top: 50%;
  z-index: 1;
  display: grid; place-items: center;
  width: 44px; height: 44px;
  transform: translate(-50%, -50%);
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--surface);
  color: var(--ink);
}
.swap:hover { border-color: var(--accent); color: var(--accent); }
.hint { margin: 12px 2px 14px; color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; min-height: 1.4em; }

/* Lignes de saisie et de résultat */
.rows { display: grid; gap: 12px; }
.line { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.line.bad { border-color: var(--bad); }
.in-cell { display: flex; align-items: center; gap: 6px; min-height: 64px; padding: 4px 16px 4px 6px; }
.in-cell:focus-within { box-shadow: inset 0 0 0 2px var(--accent); }
.sign {
  flex: none;
  width: 44px; height: 44px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--muted);
  font-size: 0.95rem;
}
.sign:hover { background: var(--bg); color: var(--ink); }
.in-cell input {
  flex: 1;
  min-width: 0;
  height: 56px;
  padding: 0 4px;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ink);
  font-size: clamp(1.5rem, 6.5vw, 1.9rem);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}
.in-cell input::placeholder { color: var(--muted); opacity: 0.7; }
.u { flex: none; color: var(--muted); font-size: 1rem; white-space: nowrap; }
.out-cell { display: flex; align-items: center; gap: 8px; min-height: 64px; padding: 10px 8px 10px 16px; background: var(--tint); }
.out-cell output {
  flex: 1;
  min-width: 0;
  color: var(--accent);
  font-size: clamp(1.4rem, 6vw, 1.9rem);
  font-weight: 700;
  line-height: 1.15;
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}
.out-cell.empty output { color: var(--muted); font-weight: 400; }
.out-u { color: var(--accent); opacity: 0.85; }
.copy {
  flex: none;
  display: inline-flex; align-items: center; gap: 6px;
  min-width: 44px; height: 44px;
  padding: 0 12px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--accent);
  font-size: 0.9rem;
}
.copy:hover:not(:disabled) { background: var(--tint2); }
.copy:disabled { opacity: 0.4; cursor: default; }
.copy .i-ok { display: none; }
.copy[data-state="ok"] { background: var(--accent); color: var(--on-accent); }
.copy[data-state="ok"] .i-copy { display: none; }
.copy[data-state="ok"] .i-ok { display: block; }
.copy[data-state="fail"] { background: var(--bad); color: var(--surface); }
.copy .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.copy[data-state="fail"] .lbl { position: static; width: auto; height: auto; overflow: visible; clip-path: none; }
.note { margin: 0; padding: 8px 16px; background: var(--surface); border-top: 1px solid var(--line); color: var(--warn); font-size: 0.88rem; }
.note:empty { display: none; }
.line.bad .note { color: var(--bad); }

/* Catalogue des unités */
.catalog { margin-top: 24px; }
.catalog summary {
  display: flex; align-items: center; justify-content: space-between;
  min-height: 48px;
  padding: 0 6px 0 2px;
  font-size: 1.05rem;
  font-weight: 700;
  list-style: none;
  cursor: pointer;
}
.catalog summary::-webkit-details-marker { display: none; }
.catalog summary::after {
  content: "";
  width: 9px; height: 9px;
  border-right: 2px solid currentColor;
  border-bottom: 2px solid currentColor;
  transform: rotate(45deg);
  margin-bottom: 4px;
}
.catalog[open] summary::after { transform: rotate(-135deg); margin-bottom: -4px; }
.cat-g { margin: 18px 2px 8px; color: var(--muted); font-size: 0.88rem; font-weight: 700; }
.cat-l { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.cat-i { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 12px 14px; border-top: 1px solid var(--line); }
.cat-i:first-child { border-top: 0; }
.cat-i.on { background: var(--tint); }
.cat-h { grid-column: 1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; min-width: 0; }
.cat-n { font-weight: 600; }
.cat-s { color: var(--muted); }
.cat-r { grid-column: 2; grid-row: 1 / span 2; display: flex; align-items: flex-start; gap: 6px; }
.cat-u { grid-column: 1; color: var(--muted); font-size: 0.86rem; }
.cat-e { grid-column: 1 / -1; margin-top: 2px; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
.pill {
  min-height: 36px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font-size: 0.8rem;
}
.pill[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.foot { margin: 22px 2px 0; color: var(--muted); font-size: 0.85rem; max-width: 62ch; }
.band-side { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.doc { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 6px; color: var(--band-muted); font-size: 0.88rem; text-decoration: underline; text-underline-offset: 3px; }
.doc:hover { color: var(--band-ink); }
.brand { min-width: 0; }
h1 { font-size: clamp(1.3rem, 5.4vw, 2.2rem); overflow-wrap: break-word; hyphens: auto; -webkit-hyphens: auto; }
.lang-code { display: none; font-weight: 600; letter-spacing: 0.03em; }
@media (max-width: 479px) {
  .lang-name { display: none; }
  .lang-code { display: inline; }
  .doc .fr { display: none; }
}

/* Grands écrans */
@media (min-width: 700px) {
  .line { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; background: transparent; border: 0; border-radius: 0; overflow: visible; }
  .in-cell, .out-cell { min-height: 76px; border: 1px solid var(--line); border-radius: 14px; }
  .in-cell { padding: 0 16px 0 8px; background: var(--surface); }
  .out-cell { padding: 0 8px 0 16px; border-color: transparent; }
  .line.bad .in-cell { border-color: var(--bad); }
  .note { grid-column: 1 / -1; margin-top: -4px; padding: 0 4px; background: transparent; border-top: 0; }
  .copy .lbl { position: static; width: auto; height: auto; overflow: visible; clip-path: none; }
}
@media (min-width: 760px) {
  .tabs { flex-wrap: wrap; margin: 0; padding: 2px 0 18px; overflow: visible; -webkit-mask-image: none; mask-image: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .copy, .tab, .pill, .swap { transition: background-color 0.15s, border-color 0.15s, color 0.15s; }
}
</style>
</head>
<body>
<header>
  <div class="band">
    <div class="band-in">
      <div class="band-top">
        <div class="brand">
          <h1 id="title">Convertisseur d’unités</h1>
          <p class="lede" id="lede">Choisissez une grandeur et deux unités, puis saisissez jusqu’à trois valeurs à convertir.</p>
        </div>
        <div class="band-side">
        <label class="lang">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18"/></svg>
          <span class="lang-name" id="langname">Français</span>
          <span class="lang-code" id="langcode">FR</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          <span class="sr" id="langlabel">Langue</span>
          <select id="lang">
            <option value="fr">Français</option>
            <option value="en">English</option>
            <option value="de">Deutsch</option>
            <option value="it">Italiano</option>
            <option value="es">Español</option>
            <option value="sv">Svenska</option>
          </select>
        </label>
        <a class="doc" id="readme" href="README.md" target="_blank" rel="noopener" hreflang="fr" title="Documentation (README, en français)" aria-label="Documentation (README, en français)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></svg>
          <span>README<span class="fr" id="readme-lang"> (FR)</span></span>
        </a>
        </div>
      </div>
      <div class="tabs" role="tablist" aria-label="Grandeur physique" id="tabs"></div>
    </div>
  </div>
  <div class="ruler" aria-hidden="true"></div>
</header>

<main class="app">
  <section class="panel" id="panel" role="tabpanel">
    <p class="qdesc" id="qdesc"></p>

    <div class="pickers">
      <label class="pick">
        <span class="pick-cap" id="lbl-from">Unité d’entrée</span>
        <b class="pick-sym" id="pk-from-sym"></b>
        <span class="pick-name" id="pk-from-name"></span>
        <svg class="pick-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        <select id="from"></select>
      </label>
      <button type="button" class="swap" id="swap" aria-label="Inverser l’unité d’entrée et l’unité de sortie" title="Inverser les unités">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4 3 8l4 4"/><path d="M3 8h14"/><path d="m17 12 4 4-4 4"/><path d="M21 16H7"/></svg>
      </button>
      <label class="pick">
        <span class="pick-cap" id="lbl-to">Unité de sortie</span>
        <b class="pick-sym" id="pk-to-sym"></b>
        <span class="pick-name" id="pk-to-name"></span>
        <svg class="pick-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        <select id="to"></select>
      </label>
    </div>

    <p class="hint" id="hint"></p>
    <div class="rows" id="rows"></div>
  </section>

  <details class="catalog" id="catalog" open>
    <summary id="catsum">Unités disponibles</summary>
    <div id="catbody"></div>
  </details>

  <p class="foot" id="foot"></p>
</main>

<script>
"use strict";

/* ---------- Données ---------- */
/* README ouvert par le lien du bandeau : version française si la langue est le français, sinon version anglaise.
   Remplacez par des URL complètes si les fichiers ne sont pas déposés à côté de la page. */
const README_URL = { fr: "README.md", en: "README.en.md" };
const PARSEC = 149597870700 * 648000 / Math.PI;
const U = (id, name, sym, grp, use, f) => ({ id, name, sym, grp, use, f });
const T = (id, name, sym, grp, use, toC, fromC, formula) => ({ id, name, sym, grp, use, toC, fromC, formula });

const QUANTITIES = [
  {
    key: "longueur", label: "Longueur", base: "m", from: "in", to: "cm",
    desc: "Unité SI : le mètre (m). Les unités anglo-saxonnes sont définies exactement à partir du mètre (1 in = 25,4 mm).",
    units: [
      U("nm", "nanomètre", "nm", "SI et multiples décimaux", "SI. Nanotechnologies, optique", 1e-9),
      U("um", "micromètre", "µm", "SI et multiples décimaux", "SI. Micromécanique, microscopie", 1e-6),
      U("mm", "millimètre", "mm", "SI et multiples décimaux", "SI. Atelier, dessin technique", 1e-3),
      U("cm", "centimètre", "cm", "SI et multiples décimaux", "Métrique. Usage courant", 1e-2),
      U("m", "mètre", "m", "SI et multiples décimaux", "Unité SI de base", 1),
      U("km", "kilomètre", "km", "SI et multiples décimaux", "Métrique. Distances routières", 1e3),
      U("mil", "millième de pouce (thou)", "mil", "États-Unis et Royaume-Uni", "États-Unis, Royaume-Uni. Usinage, épaisseurs", 2.54e-5),
      U("in", "pouce", "in", "États-Unis et Royaume-Uni", "États-Unis, Royaume-Uni, Canada. Usage courant", 0.0254),
      U("ft", "pied", "ft", "États-Unis et Royaume-Uni", "États-Unis, Royaume-Uni. Usage courant, altitudes en aviation", 0.3048),
      U("yd", "yard", "yd", "États-Unis et Royaume-Uni", "Royaume-Uni, États-Unis. Sport, textile", 0.9144),
      U("fur", "furlong", "fur", "États-Unis et Royaume-Uni", "Royaume-Uni, États-Unis. Courses hippiques", 201.168),
      U("mi", "mile", "mi", "États-Unis et Royaume-Uni", "États-Unis, Royaume-Uni. Distances routières", 1609.344),
      U("ftm", "brasse (fathom)", "ftm", "Marine", "Monde anglo-saxon. Profondeurs marines", 1.8288),
      U("nmi", "mille marin", "nmi", "Marine", "International. Navigation maritime et aérienne", 1852),
      U("shaku", "shaku", "shaku", "Asie", "Japon. Construction traditionnelle", 10 / 33),
      U("chi", "chi (市尺)", "chi", "Asie", "Chine. Usage courant traditionnel", 1 / 3),
      U("A", "angström", "Å", "Science et astronomie", "Physique, chimie, cristallographie", 1e-10),
      U("ua", "unité astronomique", "ua", "Science et astronomie", "Astronomie. Distances dans le système solaire", 149597870700),
      U("al", "année-lumière", "al", "Science et astronomie", "Astronomie. Distances interstellaires", 9460730472580800),
      U("pc", "parsec", "pc", "Science et astronomie", "Astronomie. Distances stellaires", PARSEC)
    ]
  },
  {
    key: "temperature", label: "Température", temp: true, from: "C", to: "F",
    desc: "Unité SI : le kelvin (K). Les conversions passent par le degré Celsius.",

QUANTITIES.forEach(q => {
  q.gl = [];
  q.units.forEach((u, i) => {
    u.i = i;
    let gi = q.gl.indexOf(u.grp);
    if (gi < 0) { gi = q.gl.length; q.gl.push(u.grp); }
    u.gi = gi;
  });
});

const LANGS = {};
function defLang(code, d) {
  for (const k in d.q) {
    const t = d.q[k];
    ["groups", "names", "uses"].forEach(f => { t[f] = t[f].split("|"); });
  }
  LANGS[code] = d;
}

/* ---------- Utilitaires ---------- */
let NF = new Intl.NumberFormat("fr-FR", { maximumSignificantDigits: 12 });
let NF3 = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 3 });
let DEC = ",";
const NBSP = "\u00a0";

function fmtHTML(x) {
  if (!isFinite(x)) return "—";
  if (x === 0) return "0";
  const a = Math.abs(x);
  if (a >= 1e-4 && a < 1e12) return NF.format(x);
  let [m, e] = x.toExponential(11).split("e");
  m = m.replace(/\.?0+$/, "").replace(".", DEC);
  const n = parseInt(e, 10);
  return m + NBSP + "×" + NBSP + "10<sup>" + (n < 0 ? "−" : "") + Math.abs(n) + "</sup>";
}

/* Résultats : 3 décimales au maximum (notation scientifique pour les très petites et très grandes valeurs) */
function fmtResult(x) {
  if (!isFinite(x)) return "—";
  if (x === 0) return "0";
  const a = Math.abs(x);
  if (a >= 5e-4 && a < 1e12) return NF3.format(x);
  let [m, e] = x.toExponential(3).split("e");
  m = m.replace(/\.?0+$/, "").replace(".", DEC);
  const n = parseInt(e, 10);
  return m + NBSP + "×" + NBSP + "10<sup>" + (n < 0 ? "−" : "") + Math.abs(n) + "</sup>";
}

function parseValue(s) {
  let t = s.replace(/[\s\u00a0\u202f\u2019']/g, "").replace(/[−–]/g, "-");
  const lc = t.lastIndexOf(","), ld = t.lastIndexOf(".");
  if (lc >= 0 && ld >= 0) {
    const dec = lc > ld ? "," : ".", grp = dec === "," ? "." : ",";
    t = t.split(grp).join("").replace(dec, ".");
  } else {
    t = t.replace(",", ".");
  }
  if (t === "" || t === "-" || t === "+") return null;
  if (!/^[+-]?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?$/i.test(t)) return NaN;
  return Number(t);
}

function plain(x) {
  const a = Math.abs(x);
  const v = (a === 0 || (a >= 5e-4 && a < 1e12)) ? Number(x.toFixed(3)) : Number(x.toExponential(3));
  return String(v).replace(".", DEC);
}

function convert(q, from, to, v) {
  return q.temp ? to.fromC(from.toC(v)) : v * from.f / to.f;
}

async function copyText(t) {
  try {
    await navigator.clipboard.writeText(t);
    return true;
  } catch (e) {
    try {
      const ta = document.createElement("textarea");
      ta.value = t;
      ta.style.cssText = "position:fixed;opacity:0";
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand("copy");
      ta.remove();
      return ok;
    } catch (e2) { return false; }
  }
}

/* ---------- État et mémorisation des unités choisies ---------- */
const STORE = "convertisseur-unites-v1";
const state = { q: QUANTITIES[0].key, lang: "fr", sel: {} };
QUANTITIES.forEach(q => { state.sel[q.key] = { from: q.from, to: q.to }; });

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE) || "null");
    if (!s || typeof s !== "object") return;
    if (typeof s.lang === "string" && LANGS[s.lang]) state.lang = s.lang;
    /* La page s'ouvre toujours sur Longueur (in vers cm) : seule la langue est restauree. */
  } catch (e) { /* stockage indisponible : on garde les valeurs par défaut */ }
}
function save() {
  try { localStorage.setItem(STORE, JSON.stringify({ lang: state.lang })); } catch (e) { /* ignoré */ }
}

const cur = () => QUANTITIES.find(q => q.key === state.q);
const unitOf = (q, id) => q.units.find(u => u.id === id);

/* Accès aux textes traduits (repli sur le français) */
const LG = () => LANGS[state.lang];
function ui(key, vars) {
  let s = LG().ui[key];
  if (s === undefined) s = LANGS.fr.ui[key];
  if (vars) for (const k in vars) s = s.split("{" + k + "}").join(vars[k]);
  return s;
}
const qT = q => LG().q[q.key];
const qLabel = q => { const t = qT(q); return t ? t.label : q.label; };
const qDesc = q => { const t = qT(q); return t ? t.desc : q.desc; };
const uName = (q, u) => { const t = qT(q); return (t && t.names[u.i]) || u.name; };
const uUse = (q, u) => { const t = qT(q); return (t && t.uses[u.i]) || u.use; };
const gName = (q, u) => { const t = qT(q); return (t && t.groups[u.gi]) || u.grp; };
const uSym = (q, u) => LG().sym[q.key + "." + u.id] || u.sym;
function units() {
  const q = cur(), s = state.sel[q.key];
  return { q, from: unitOf(q, s.from), to: unitOf(q, s.to) };
}

/* ---------- Éléments ---------- */
const $ = s => document.querySelector(s);
const tabsEl = $("#tabs"), panel = $("#panel"), qdesc = $("#qdesc");
const selFrom = $("#from"), selTo = $("#to"), hintEl = $("#hint"), rowsEl = $("#rows");
const catBody = $("#catbody"), catSum = $("#catsum"), catEl = $("#catalog");

/* Onglets des grandeurs */
const tabBtns = QUANTITIES.map(q => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "tab";
  b.id = "tab-" + q.key;
  b.setAttribute("role", "tab");
  b.textContent = q.label;
  b.addEventListener("click", () => setQuantity(q.key));
  tabsEl.appendChild(b);
  return b;
});
tabsEl.addEventListener("keydown", e => {
  if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) return;
  e.preventDefault();
  const n = QUANTITIES.length;
  let i = QUANTITIES.findIndex(q => q.key === state.q);
  if (e.key === "ArrowRight") i = (i + 1) % n;
  else if (e.key === "ArrowLeft") i = (i - 1 + n) % n;
  else if (e.key === "Home") i = 0;
  else i = n - 1;
  setQuantity(QUANTITIES[i].key);
  tabBtns[i].focus();
});

/* Défilement des grandeurs : fondu aux bords */
function updateTabFade() {
  const el = tabsEl, max = el.scrollWidth - el.clientWidth;
  el.style.setProperty("--fl", el.scrollLeft > 4 ? "28px" : "0px");
  el.style.setProperty("--fr", el.scrollLeft < max - 4 ? "28px" : "0px");
}
tabsEl.addEventListener("scroll", updateTabFade, { passive: true });
window.addEventListener("resize", updateTabFade);

/* Trois lignes de conversion */
const ICON_COPY = '<svg class="i-copy" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
const ICON_OK = '<svg class="i-ok" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>';

function setCopyState(r, st) {
  r.copy.dataset.state = st;
  const label = st === "ok" ? ui("copied") : st === "fail" ? ui("copyFail") : ui("copy");
  r.copyLbl.textContent = label;
  r.copy.setAttribute("aria-label", label);
}

const rows = [0, 1, 2].map(i => {
  const el = document.createElement("div");
  el.className = "line";
  el.innerHTML =
    '<div class="in-cell">' +
      '<button type="button" class="sign">+/−</button>' +
      '<input type="text" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false">' +
      '<span class="u in-u"></span>' +
    '</div>' +
    '<div class="out-cell empty">' +
      '<output>–</output><span class="u out-u"></span>' +
      '<button type="button" class="copy" disabled>' + ICON_COPY + ICON_OK + '<span class="lbl"></span></button>' +
    '</div>' +
    '<p class="note" role="status"></p>';
  rowsEl.appendChild(el);
  const r = {
    el,
    input: el.querySelector("input"),
    sign: el.querySelector(".sign"),
    inU: el.querySelector(".in-u"),
    res: el.querySelector(".out-cell"),
    out: el.querySelector("output"),
    outU: el.querySelector(".out-u"),
    note: el.querySelector(".note"),
    copy: el.querySelector(".copy"),
    copyLbl: el.querySelector(".copy .lbl"),
    value: null
  };
  r.input.value = String(i + 1);
  r.input.addEventListener("input", update);
  r.sign.addEventListener("click", () => {
    const v = r.input.value.trim();
    r.input.value = /^[-\u2212]/.test(v) ? v.slice(1) : "-" + v;
    update();
  });
  r.copy.addEventListener("click", async () => {
    if (r.value === null) return;
    const ok = await copyText(plain(r.value));
    setCopyState(r, ok ? "ok" : "fail");
    setTimeout(() => setCopyState(r, "idle"), 1400);
  });
  return r;
});

/* ---------- Rendu ---------- */
function fillSelect(sel, q, value) {
  sel.innerHTML = "";
  let grp = null, og = null;
  q.units.forEach(u => {
    if (u.grp !== grp) {
      og = document.createElement("optgroup");
      og.label = gName(q, u);
      sel.appendChild(og);
      grp = u.grp;
    }
    const o = document.createElement("option");
    o.value = u.id;
    o.textContent = uName(q, u) + " (" + uSym(q, u) + ")";
    og.appendChild(o);
  });
  sel.value = value;
}

function renderTable() {
  const q = cur();
  catSum.textContent = ui("catalog", { n: q.units.length });
  let html = "", grp = null;
  q.units.forEach(u => {
    if (u.grp !== grp) {
      if (grp !== null) html += "</ul>";
      html += '<h3 class="cat-g">' + gName(q, u) + '</h3><ul class="cat-l">';
      grp = u.grp;
    }
    const last = q.temp ? u.formula.replace(/,/g, DEC) : "1" + NBSP + uSym(q, u) + " = " + fmtHTML(u.f) + NBSP + q.base;
    const nm = uName(q, u);
    html += '<li class="cat-i" data-id="' + u.id + '">' +
      '<div class="cat-h"><span class="cat-n">' + nm + '</span><span class="cat-s">' + uSym(q, u) + '</span></div>' +
      '<div class="cat-r">' +
        '<button type="button" class="pill" data-role="from" data-id="' + u.id + '" aria-label="' + ui("tagIn") + " : " + nm + '">' + ui("tagIn") + '</button>' +
        '<button type="button" class="pill" data-role="to" data-id="' + u.id + '" aria-label="' + ui("tagOut") + " : " + nm + '">' + ui("tagOut") + '</button>' +
      '</div>' +
      '<div class="cat-u">' + uUse(q, u) + '</div>' +
      '<div class="cat-e">' + last + '</div>' +
    '</li>';
  });
  catBody.innerHTML = html + "</ul>";
}

function renderSelection() {
  const { q, from, to } = units();
  panel.setAttribute("aria-labelledby", "tab-" + q.key);

  const fs = uSym(q, from), ts = uSym(q, to);
  $("#pk-from-sym").textContent = fs;
  $("#pk-from-name").textContent = uName(q, from);
  $("#pk-to-sym").textContent = ts;
  $("#pk-to-name").textContent = uName(q, to);
  rows.forEach(r => { r.inU.textContent = fs; r.outU.textContent = ts; });

  if (q.temp) {
    const pair = c => fmtHTML(from.fromC(c)) + NBSP + fs + " = " + fmtHTML(to.fromC(c)) + NBSP + ts;
    hintEl.innerHTML = ui("hintTemp", { a: pair(0), b: pair(100) });
  } else {
    hintEl.innerHTML = "1" + NBSP + fs + " = " + fmtHTML(from.f / to.f) + NBSP + ts;
  }

  catBody.querySelectorAll(".cat-i").forEach(li => {
    const id = li.dataset.id, isFrom = id === from.id, isTo = id === to.id;
    li.classList.toggle("on", isFrom || isTo);
    li.querySelector('[data-role="from"]').setAttribute("aria-pressed", isFrom ? "true" : "false");
    li.querySelector('[data-role="to"]').setAttribute("aria-pressed", isTo ? "true" : "false");
  });
}

function setOut(r, html, empty) {
  r.out.innerHTML = html;
  r.res.classList.toggle("empty", empty);
}

function update() {
  const { q, from, to } = units();
  rows.forEach(r => {
    const v = parseValue(r.input.value);
    r.el.classList.remove("bad");
    r.note.textContent = "";
    r.value = null;

    if (v === null) {
      setOut(r, "–", true);
    } else if (Number.isNaN(v)) {
      setOut(r, "–", true);
      r.el.classList.add("bad");
      r.note.textContent = ui("errNumber");
    } else {
      const res = convert(q, from, to, v);
      if (!isFinite(res)) {
        setOut(r, "–", true);
        r.el.classList.add("bad");
        r.note.textContent = ui("errRange");
      } else {
        r.value = res;
        setOut(r, fmtResult(res), false);
        if (q.temp && from.toC(v) < -273.15 - 1e-9) {
          r.note.textContent = ui("errAbsZero");
        }
      }
    }
    r.copy.disabled = r.value === null;
  });
}

function setQuantity(key) {
  state.q = key;
  const q = cur(), s = state.sel[q.key];
  tabBtns.forEach((b, i) => {
    const on = QUANTITIES[i].key === key;
    b.setAttribute("aria-selected", on ? "true" : "false");
    b.tabIndex = on ? 0 : -1;
  });
  const activeTab = tabBtns[QUANTITIES.indexOf(q)];
  if (activeTab.scrollIntoView) {
    const calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    activeTab.scrollIntoView({ inline: "center", block: "nearest", behavior: calm ? "auto" : "smooth" });
  }
  updateTabFade();
  qdesc.textContent = qDesc(q);
  fillSelect(selFrom, q, s.from);
  fillSelect(selTo, q, s.to);
  renderTable();
  renderSelection();
  update();
  save();
}

function onUnitChange() {
  const s = state.sel[state.q];
  s.from = selFrom.value;
  s.to = selTo.value;
  renderSelection();
  update();
  save();
}
selFrom.addEventListener("change", onUnitChange);
selTo.addEventListener("change", onUnitChange);
$("#swap").addEventListener("click", () => {
  const a = selFrom.value;
  selFrom.value = selTo.value;
  selTo.value = a;
  onUnitChange();
});

catBody.addEventListener("click", e => {
  const b = e.target.closest("button[data-role]");
  if (!b) return;
  (b.dataset.role === "from" ? selFrom : selTo).value = b.dataset.id;
  onUnitChange();
});

const selLang = $("#lang");

function applyLang() {
  NF = new Intl.NumberFormat(LG().locale, { maximumSignificantDigits: 12 });
  NF3 = new Intl.NumberFormat(LG().locale, { maximumFractionDigits: 3 });
  DEC = NF.formatToParts(1.1).find(p => p.type === "decimal").value;
  document.documentElement.lang = state.lang;
  document.title = ui("title");
  selLang.value = state.lang;
  $("#title").textContent = ui("title");
  $("#lede").textContent = ui("lede");
  $("#langlabel").textContent = ui("language");
  tabsEl.setAttribute("aria-label", ui("tablist"));
  $("#lbl-from").textContent = ui("fromLabel");
  $("#lbl-to").textContent = ui("toLabel");
  $("#swap").setAttribute("aria-label", ui("swap"));
  $("#swap").title = ui("swap");
  $("#langname").textContent = LG().name;
  $("#langcode").textContent = state.lang.toUpperCase();
  $("#foot").textContent = ui("foot");
  $("#readme").setAttribute("aria-label", ui("readme"));
  $("#readme").title = ui("readme");
  const rd = state.lang === "fr" ? "fr" : "en";
  $("#readme").href = README_URL[rd];
  $("#readme").hreflang = rd;
  $("#readme-lang").textContent = " (" + rd.toUpperCase() + ")";
  tabBtns.forEach((b, i) => { b.textContent = qLabel(QUANTITIES[i]); });
  rows.forEach((r, i) => {
    r.input.setAttribute("aria-label", ui("valueN", { n: i + 1 }));
    r.input.placeholder = ui("placeholder", { n: i + 1 });
    r.sign.setAttribute("aria-label", ui("sign"));
    r.sign.title = ui("sign");
    setCopyState(r, "idle");
  });
  setQuantity(state.q);
}
selLang.addEventListener("change", () => {
  state.lang = selLang.value;
  applyLang();
});

if (window.matchMedia && window.matchMedia("(max-width: 640px)").matches) catEl.open = false;
load();
applyLang();
</script>
</body>
</html>
